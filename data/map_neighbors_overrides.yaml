# Hand-curated overrides applied by `scrape-map-neighbors` as the final
# pass, after symmetrize + reconcile_directions. The wiki infobox is the
# source of truth for most edges; this file patches the cases where:
#
# - the infobox documents an edge with the wrong shape (Plains of
#   Ashford → Skywatch Archipelago is a story-gated portal, not a
#   physical border);
# - both wiki pages omit a real in-game connection (Mistlock
#   Sanctuary's Portal to Tyria → Lion's Arch);
# - the `requires` field is absent for special maps that belong to
#   Living-World Seasons 1-2 or are recurring festival content (SAB,
#   Labyrinthine Cliffs, Crown Pavilion);
# - guild-hall maps whose `requires` field is missing.
#
# Every claim below was verified against
# `wiki.guildwars2.com/wiki/<MapName>` and the relevant URL is recorded
# in the trailing comment for each row. Drop a row sooner than guess.

edge_overrides:
  # Plains of Ashford (19) → Skywatch Archipelago (1510).
  # Wiki: main access is a portal at Wizard's Tower; from Plains of
  # Ashford specifically, access is a story-gated "secret portal" at
  # Lake Adorea — only available after the relevant SotO story chapter.
  # Source: https://wiki.guildwars2.com/wiki/Skywatch_Archipelago
  - src_map_id: 19
    dst_map_id: 1510
    connection: story_gate
    direction: ~
    gate_location: Lake Adorea (Plains of Ashford)
    note: "Secret portal — requires SotO story progression. Main access is via Wizard's Tower."
  # Reverse side of the same edge — symmetrize generated it as a
  # physical border, but it's the same story-gated portal.
  - src_map_id: 1510
    dst_map_id: 19
    connection: story_gate
    direction: ~
    gate_location: Lake Adorea (Plains of Ashford)
    note: "Secret portal — requires SotO story progression."

edge_additions:
  # Mistlock Sanctuary (1206) → Lion's Arch (50) via the in-lounge
  # "Portal to Tyria". One-way: you can leave Mistlock to LA but you
  # can't board the portal from outside without a Mistlock Sanctuary
  # Passkey (Gem Store). LA's wiki page does not document the inbound
  # side, so we don't add it.
  # Source:
  # - https://wiki.guildwars2.com/wiki/Portal_to_Tyria_(Mistlock_Sanctuary)
  # - https://wiki.guildwars2.com/wiki/Mistlock_Sanctuary
  - src_map_id: 1206
    dst_map_id: 50
    connection: asura_gate
    one_way: true
    note: "Portal to Tyria within Mistlock Sanctuary. Reaching the sanctuary itself requires a Mistlock Sanctuary Passkey from the Gem Store."

