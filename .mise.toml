# mise configuration for gw2-mcp
#
# Pinned toolchain so every contributor (and CI) builds against the same
# Rust release. Run `mise install` after cloning, then `mise run <task>`.

[tools]
rust = { version = "1.91", profile = "default" }
"cargo:cargo-audit" = "latest"
"cargo:cargo-llvm-cov" = "latest"
gitleaks = "latest"
lefthook = "latest"

[env]
# RUST_BACKTRACE is intentionally NOT set here. Backtraces leak source
# paths, crate versions, and internal call stacks on stderr — and in
# the MCP topology stderr goes straight to the host process. Tests
# scope it on per-task (see [tasks.test.env] etc.) so failure
# diagnostics still get the full backtrace.

# Load secrets / per-engineer overrides from a local .env file (gitignored).
# Format is `KEY=value` lines; quoting is optional. Missing file is fine —
# mise treats _.file as best-effort. See .env.example for the variables
# this project understands.
_.file = ".env"

[tasks.install-hooks]
description = "Install git hooks via lefthook"
run = "lefthook install"

[tasks.build]
description = "Build the binary (debug)"
run = "cargo build"

[tasks.release]
description = "Build the binary (release, optimized)"
run = "cargo build --release"

[tasks.run]
description = "Run the MCP server"
run = "cargo run -- $@"

[tasks.test]
description = "Run all tests"
run = "cargo test --all-targets"
env = { RUST_BACKTRACE = "1" }

[tasks.test-unit]
description = "Run only unit tests (skip integration tests)"
run = "cargo test --lib"
env = { RUST_BACKTRACE = "1" }

[tasks.test-integration]
description = "Run only integration tests"
run = "cargo test --tests"
env = { RUST_BACKTRACE = "1" }

[tasks.fmt]
description = "Format code with rustfmt"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Verify formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy linter (warnings as errors)"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.audit]
description = "Audit dependencies for known vulnerabilities (warnings on unmaintained crates are non-fatal)"
run = "cargo audit"

[tasks.coverage]
description = "Generate code coverage report (HTML + text)"
run = """
mkdir -p coverage
cargo llvm-cov --html --output-dir coverage/html
cargo llvm-cov report --summary-only
echo ""
echo "HTML coverage report: coverage/html/index.html"
"""

[tasks.check-all]
description = "Run fmt-check, clippy, and tests"
run = """
mise run fmt-check
mise run clippy
mise run test
"""

[tasks.clean]
description = "Remove build artefacts"
run = "cargo clean"

[tasks.refresh-map-neighbors]
description = "Re-scrape the GW2 wiki to regenerate data/map_neighbors.yaml. Run when an expansion ships, or to refresh stale wiki edits. Hits live wiki + GW2 API; takes ~30s. The scraper reports unresolved neighbor page names to stderr for hand-review."
run = "cargo run -p scrape-map-neighbors --release -- --out data/map_neighbors.yaml"

[tasks.refresh-wiki-access]
description = "Re-scrape the GW2 wiki to regenerate data/wiki_zone_access.md — a per-zone markdown dump of intro paragraphs + infobox fields + every 'Getting there' / 'Access' / 'Portal' / 'Asura gate' / 'Entrance' section. Use as LLM context when proposing edits to data/map_neighbors_overrides.yaml. Hits live wiki + GW2 API; takes ~90s."
run = "cargo run -p scrape-wiki-access --release -- --out data/wiki_zone_access.md"

[tasks.refresh-map-snapshot]
description = "Re-fetch the slimmed /v2/maps?ids=all snapshot used by the map-neighbors integrity test. Run after refresh-map-neighbors if a new map id appears (or if ArenaNet renames a map)."
run = """
curl -s 'https://api.guildwars2.com/v2/maps?ids=all' | python3 -c "
import json, sys
data = json.load(sys.stdin)
slim = [{'id': m['id'], 'name': m.get('name', ''), 'region_name': m.get('region_name', '')} for m in data]
print(json.dumps(slim, indent=2))
" > tests/common/map_snapshot.json
echo "  refreshed tests/common/map_snapshot.json ($(wc -l < tests/common/map_snapshot.json) lines)"
"""
