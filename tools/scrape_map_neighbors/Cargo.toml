[package]
name = "scrape-map-neighbors"
version = "0.0.0"
edition = "2024"
publish = false
description = "One-shot wiki scraper that builds data/map_neighbors.yaml for the gw2-mcp server."

[[bin]]
name = "scrape-map-neighbors"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
