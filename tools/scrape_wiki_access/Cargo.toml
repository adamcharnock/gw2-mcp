[package]
name = "scrape-wiki-access"
version = "0.0.0"
edition = "2024"
publish = false
description = "Scrapes per-zone 'Getting there' / 'Location' / 'Access' prose from the GW2 wiki into a single LLM-readable markdown dump."

[[bin]]
name = "scrape-wiki-access"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
