[workspace]
# Build tools (one-shot scrapers etc.) live under `tools/` as separate
# crates so their dev-time deps don't bloat the gw2-mcp release binary.
members = [
    ".",
    "tools/scrape_map_neighbors",
    "tools/scrape_wiki_access",
]

[package]
name = "gw2-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Guild Wars 2 Model Context Protocol (MCP) server"
license = "AGPL-3.0-or-later"
repository = "https://github.com/adamcharnock/gw2-mcp"
readme = "README.md"
keywords = ["mcp", "guildwars2", "gw2", "llm"]
categories = ["command-line-utilities", "api-bindings"]
# Two binaries (gw2-mcp + gw2-mcp-holder) means `cargo run` can't infer
# which to launch — pin the default to the MCP server so `cargo run`
# and tasks like `mise run run` work without `--bin`.
default-run = "gw2-mcp"

[lib]
name = "gw2_mcp"
path = "src/lib.rs"

[[bin]]
name = "gw2-mcp"
path = "src/main.rs"

# In-bottle helper that pre-creates the Mumble Link named mapping so GW2's
# opener-only writer publishes data on macOS/CrossOver. Source is gated
# `#![cfg(target_os = "windows")]`; on non-Windows targets the bin is an
# empty `main()`. The macOS gw2-mcp launches it via cxstart automatically.
[[bin]]
name = "gw2-mcp-holder"
path = "src/bin/holder.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# MCP server
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = { version = "1.1", features = ["chrono04"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
url = "2.5"
percent-encoding = "2.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.5"

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Domain primitives
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"

# Cache
moka = { version = "0.12", features = ["future"] }

# Build chat code decoding
chatr = "0.7"

# HTML parsing (Snow Crows scraper, Phase B.3)
scraper = "0.27"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Retry-After header parsing + jitter
httpdate = "1"
rand = "0.10"

# Mumble Link reader: zero-copy struct casts of the C-shaped MumbleLink block.
bytemuck = { version = "1", features = ["derive"] }
# Cross-platform memory mapping for /dev/shm/MumbleLink (Linux + Wine on macOS).
memmap2 = "0.9"

# On-disk search index (Tier 6C). `sqlx` is async-first (no spawn_blocking
# dance), pools connections natively, and the `migrate` feature embeds the
# files under `migrations/` at compile time. `sqlite` pulls in
# `libsqlite3-sys` with the bundled SQLite — keeps the distroless container
# self-contained with no system dep, and means CI doesn't have to install
# libsqlite3-dev. FTS5 is compiled in by default.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "sqlite",
    "migrate",
] }
# OS-standard cache directory resolution.
directories = "6"

# aarch64-linux-only: pin `openssl-sys`'s `vendored` feature so the
# cross-build compiles OpenSSL from source. Scoped to this single
# triple because:
# - Native Linux (`cargo build` on ubuntu, Docker image): system
#   libssl-dev is already present; vendored would break the Dockerfile's
#   slim Perl install (./Configure needs FindBin.pm).
# - Aarch64 cross-build (`cross build`): the stock cross-rs image's
#   libssl-dev:arm64 is OpenSSL 1.0.2g — too old for openssl-sys
#   0.9.115 which requires 1.1.0+. Vendored sidesteps this by building
#   a compatible OpenSSL from source.
# - macOS / Windows: untouched (native-tls there doesn't use openssl-sys).
#
# openssl-sys is a transitive dep (`chatr -> reqwest 0.11 -> native-tls`);
# listing it as a direct dep here is purely to force its `vendored`
# feature on for the relevant target. Cost: ~3 MB extra in the link.
[target.aarch64-unknown-linux-gnu.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

# macOS-only: `fs2` provides safe wrappers around `flock(2)` for the
# holder-supervisor lockfile, which coordinates "exactly one in-bottle
# holder per bottle" across concurrent gw2-mcp instances. Scoped to
# macOS because Linux/Windows have no holder.
[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4"

# Windows-only shared-memory access for the MumbleLink named-mapping. Behind a
# target_os = "windows" cfg so non-Windows builds don't pull it in.
[target.'cfg(target_os = "windows")'.dependencies]
# Win32_Security is needed because CreateFileMappingW's signature in the
# windows crate references SECURITY_ATTRIBUTES (we pass None, but the type
# binding must be available). The other features cover OpenFileMappingW,
# CreateFileMappingW, MapViewOfFile, FlushViewOfFile, etc.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tempfile = "3"
rstest = "0.26"
serde_json = "1"
pretty_assertions = "1.4"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 0

# Strict lints (enforced via `cargo clippy -- -D warnings` in CI/lefthook).
#
# `unsafe_code` is `deny`, not `forbid`, solely so the Windows-only Mumble
# Link reader (`adapters::mumble_link`) can `#[allow(unsafe_code)]` on the
# one tight function that calls `OpenFileMappingW` + `MapViewOfFile` —
# Windows shared memory has no safe wrapper in any current crate. Every
# other module must remain `unsafe`-free.
[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic opt-outs
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
