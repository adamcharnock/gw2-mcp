# Configuration for the `cross` cross-compilation tool. Used by:
# - ci.yml's `cross-build` job when matrix.cross == true
# - release.yml's build job when matrix.build-tool == cross
# - taiki-e/upload-rust-binary-action (which shells out to `cross`)
#
# Only aarch64-unknown-linux-gnu needs special handling: chatr's
# transitive reqwest 0.11 pulls native-tls which on Linux needs libssl.
# The stock cross-rs Docker image for that triple no longer ships
# libssl-dev for the arm64 sysroot — we install it in a pre-build step.
#
# $CROSS_DEB_ARCH is set automatically by cross to the Debian arch
# matching the Rust target (here: arm64).

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes libssl-dev:$CROSS_DEB_ARCH",
]
