name: Release

# Builds cross-compiled native binaries for every supported target and
# attaches them to a single rolling GitHub Release tagged `latest`. This
# is the *primary* distribution channel for gw2-mcp — the headline Mumble
# Link feature only works when the binary runs on the same host as the
# GW2 client, so users overwhelmingly want a native binary.
#
# Versioning posture: intentionally loose. There are no `vX.Y.Z` tags;
# every push to `main` overwrites the `latest` release with a fresh set
# of binaries. Asset filenames embed `latest` (not a version), so
# re-uploads overwrite the previous binaries at the same download URL.
# If a user needs to pin a specific commit, the workflow run page keeps
# 14-day-retained build artefacts (see ci.yml's `cross-build` job).
#
# Triggers:
#   - push to `main`: rebuild everything, replace the `latest` release.
#   - workflow_dispatch: same, useful for re-running after a transient
#                        runner failure.
#
# Design notes:
#   - Native runners are used wherever GitHub provides them: macos-latest
#     (arm64), macos-15-intel (x86_64), windows-latest, ubuntu-latest.
#     Only aarch64-unknown-linux-gnu is genuinely cross-compiled; taiki-e's
#     action transparently uses `cross` for that target.
#   - chatr (transitive reqwest 0.11) requires openssl-sys; `cross`'s
#     stock aarch64-unknown-linux-gnu image already has libssl-dev. The
#     ubuntu-latest runner has libssl-dev preinstalled. Windows MSVC and
#     macOS provide system OpenSSL substitutes.
#   - x86_64-unknown-linux-musl is intentionally excluded for now: musl
#     + openssl-sys requires either vendoring or a custom cross image,
#     and the GNU build covers the same Linux user base anyway.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Pinned via .mise.toml — keep in sync.
  RUST_TOOLCHAIN: "1.91"

# Rolling release: if a newer push comes in mid-build, cancel the older
# run — its binaries would just be overwritten anyway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Single-shot job that recreates the rolling `latest` tag + Release so
  # the matrix build below has a fresh upload target. Deleting and
  # re-creating (rather than editing in place) keeps stale assets from
  # earlier matrices that may have removed/renamed a target from piling
  # up indefinitely.
  refresh-release:
    name: refresh latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete previous latest release + tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `|| true` because the very first run won't have one to delete.
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
      - name: Create fresh latest tag
        run: |
          git tag latest
          git push origin refs/tags/latest
      - name: Create fresh latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" \
            --notes "Rolling build from main @ ${{ github.sha }}" \
            --latest

  build:
    name: build ${{ matrix.target }}
    needs: refresh-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — native build on ubuntu-latest. libssl-dev is
          # preinstalled on GitHub-hosted ubuntu runners, so chatr's
          # openssl-sys link succeeds without extra steps.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cargo

          # Linux aarch64 — actual cross-compile from Linux x86_64. We
          # explicitly use `cross`, which spins up a target-matched Docker
          # image with libssl-dev for the arm64 sysroot preinstalled.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cross

          # Windows x86_64 — native build on windows-latest, MSVC toolchain.
          # rustls is the default TLS backend for our reqwest 0.13; chatr's
          # transitive reqwest 0.11 uses Windows SChannel via native-tls and
          # does not need OpenSSL on this target.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo

          # macOS Apple Silicon — native build on macos-latest (which is
          # arm64 since GHA's October 2024 image refresh). Bundles
          # `gw2-mcp-holder.exe` (cross-compiled mingw) into the tarball
          # so CrossOver users get both binaries side-by-side.
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
            bundle-holder: true

          # macOS Intel — native build on macos-15-intel (the current
          # GHA-hosted x86_64 macOS runner; `macos-13` was retired
          # in late 2025). Cheap to include; covers Intel Mac users
          # who play GW2 via CrossOver / Parallels. Same holder bundle.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            build-tool: cargo
            bundle-holder: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pick up the `latest` tag the refresh-release job just pushed,
          # so taiki-e's action uploads to the matching GitHub Release.
          ref: refs/tags/latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # macOS bundles need the holder.exe — install the mingw target
      # alongside the macOS native one. Single rustup invocation.
      - name: Install mingw target (for holder bundle)
        if: matrix.bundle-holder
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install mingw linker (for holder bundle)
        if: matrix.bundle-holder
        run: |
          # macOS runners need the mingw cross-toolchain to link the
          # x86_64-pc-windows-gnu binary. Homebrew has a current build.
          brew install mingw-w64

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # Pre-build the in-bottle holder for the macOS bundles. Output goes
      # to `target/x86_64-pc-windows-gnu/release/gw2-mcp-holder.exe`; the
      # taiki-e action picks it up via the `include` field below.
      - name: Build gw2-mcp-holder.exe (mingw cross)
        if: matrix.bundle-holder
        run: cargo build --release --locked --target x86_64-pc-windows-gnu --bin gw2-mcp-holder

      # taiki-e/upload-rust-binary-action does the heavy lifting:
      #   - builds with --release --locked --target <triple>
      #   - strips the binary
      #   - tars / zips it with a stable naming convention
      #     (gw2-mcp-latest-<triple>.{tar.gz,zip})
      #   - computes sha256 sidecars
      #   - uploads everything to the GitHub Release for tag `latest`
      #   - if the target is anything other than the host's native triple,
      #     transparently switches to `cross` (for aarch64-linux only here)
      - name: Build & upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: gw2-mcp
          target: ${{ matrix.target }}
          # `$tag` expands to `latest` here, so asset names are stable
          # across pushes and re-uploads overwrite cleanly.
          archive: gw2-mcp-$tag-$target
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          # `cargo` for native targets, `cross` for aarch64-linux. Explicit
          # so behaviour is deterministic across runner image refreshes.
          build-tool: ${{ matrix.build-tool }}
          # macOS bundles ship `gw2-mcp-holder.exe` next to `gw2-mcp` so
          # the CrossOver auto-supervisor finds it as a sibling. Empty on
          # other targets (the `if: matrix.bundle-holder` guards build it).
          include: ${{ matrix.bundle-holder && 'target/x86_64-pc-windows-gnu/release/gw2-mcp-holder.exe' || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/latest
