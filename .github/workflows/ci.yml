name: CI

on:
  # Trigger on every push to any branch so feature branches produce
  # downloadable binaries before a PR exists. PR events still fire on
  # main-targeted PRs from forks (where push events in the fork don't
  # reach this repo's CI). The concurrency group cancels stale runs on
  # the same ref.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned via .mise.toml — keep in sync.
  RUST_TOOLCHAIN: "1.91"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Default cargo-audit posture: fail on actual vulnerabilities,
      # surface unmaintained-crate advisories as warnings (don't block
      # CI on transitive deps we don't directly control, e.g. scraper
      # pulling in fxhash, chatr pulling in rustls-pemfile 1.x).
      - run: cargo audit

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: Upload coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  # Build the full release matrix on every push. Binaries are uploaded
  # as workflow artefacts (14-day retention) so you can grab them from
  # any CI run — handy for testing branches before they merge to main.
  # The canonical rolling `latest` release uploads happen in release.yml
  # on every push to main; this job's artefacts are the per-branch /
  # per-PR equivalent.
  cross-build:
    name: cross build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            exe-suffix: .exe
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            bundle-holder: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
            bundle-holder: true
          # Holder cross-compile smoke check. We don't ship this triple
          # as a standalone artefact, but the macOS release tarballs
          # bundle the holder.exe — keep CI honest about the target.
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            cross: false
            holder-only: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-cross-build
          cache-on-failure: true
      # For aarch64-unknown-linux-gnu we use `cross` because the GHA
      # ubuntu runner doesn't ship the arm64 sysroot + libssl. `cross`
      # spins up a Docker image with both. Other targets build natively.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Install mingw cross-toolchain (Linux holder)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      # macOS bundles need the holder.exe — install the mingw target
      # alongside the macOS native one, then bring in Homebrew's mingw
      # linker. Same setup as release.yml.
      - name: Install mingw target (macOS holder bundle)
        if: matrix.bundle-holder
        run: rustup target add x86_64-pc-windows-gnu
      - name: Install mingw linker (macOS holder bundle)
        if: matrix.bundle-holder
        run: brew install mingw-w64
      - name: Pre-build gw2-mcp-holder.exe (macOS bundles)
        if: matrix.bundle-holder
        run: cargo build --release --locked --target x86_64-pc-windows-gnu --bin gw2-mcp-holder
      - name: Build (native)
        if: ${{ !matrix.cross && !matrix.holder-only }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin gw2-mcp
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} --bin gw2-mcp
      # Holder-only triples build just the in-bottle helper, not the MCP
      # server. Use --bin so cargo doesn't try to also build gw2-mcp on a
      # target where its non-Windows deps wouldn't link.
      - name: Build (holder only)
        if: matrix.holder-only
        run: cargo build --release --locked --target ${{ matrix.target }} --bin gw2-mcp-holder

      # Upload as a workflow artefact so the binary is downloadable from
      # the run's summary page. Naming mirrors release.yml's archive
      # convention with the commit sha standing in for the version tag.
      - name: Stage artefact (server)
        if: ${{ !matrix.holder-only }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/gw2-mcp${{ matrix.exe-suffix }}" staging/
          if [ "${{ matrix.bundle-holder }}" = "true" ]; then
            cp target/x86_64-pc-windows-gnu/release/gw2-mcp-holder.exe staging/
          fi
          ls -la staging/
      - name: Upload artefact (server)
        if: ${{ !matrix.holder-only }}
        uses: actions/upload-artifact@v4
        with:
          name: gw2-mcp-${{ github.sha }}-${{ matrix.target }}
          path: staging/
          if-no-files-found: error
          retention-days: 14

      - name: Upload artefact (holder-only)
        if: matrix.holder-only
        uses: actions/upload-artifact@v4
        with:
          name: gw2-mcp-holder-${{ github.sha }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gw2-mcp-holder.exe
          if-no-files-found: error
          retention-days: 14

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, audit, coverage, cross-build]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.fmt.result }}" != "success" ] \
            || [ "${{ needs.clippy.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.audit.result }}" != "success" ] \
            || [ "${{ needs.coverage.result }}" != "success" ] \
            || [ "${{ needs.cross-build.result }}" != "success" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed."
